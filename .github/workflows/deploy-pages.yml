name: Deploy static webcards
on:
  push:
    paths:
      - 'cards/**'
      - 'src/**'
      - 'scripts/**'
      - 'index.html'
      - 'site.config.json'
      - 'theme.css'
      - 'vite.config.js'
      - 'package*.json'
      - '.nvmrc'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository != 'reggi/webcard-site' && (github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build all cards into static HTML (no network capture)
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Reject stale build
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          latest="$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)"
          if [ "$latest" != "$(git rev-parse HEAD)" ]; then
            echo "Repository advanced during build; rerun deployment on the latest revision." >&2
            exit 1
          fi
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Publish summary
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf '## Static gallery published\n\n%s\n\nRevision: %s\n' "$PAGE_URL" "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
